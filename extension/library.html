<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clips · 本地笔记库</title><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="markdown.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="library.html"><img src="icons/32.png" alt="">Clips</a><button class="primary" id="new-note">＋ 添加笔记</button><nav><button data-view="records" class="selected">全部记录</button><button data-view="notes">按篇笔记</button><button data-view="inbox">待阅读</button><button data-view="archive">已归档</button><button data-view="trash">已删除</button></nav><div class="tag-heading">标签 <button id="manage-tags">管理</button></div><div id="tag-list"></div><div class="sidebar-bottom"><button id="open-settings">资料库与备份</button><span id="storage-label">尚未选择文件夹</span></div></aside>
<main><header class="toolbar"><div><h1 id="heading">笔记库</h1><span id="counts"></span></div><button id="refresh">刷新</button></header><div id="notice" role="status" hidden></div>
<section id="setup" hidden><h2>选择笔记资料库</h2><p>笔记、图片与字幕保存在你选择的文件夹中。</p><button class="primary" id="choose-folder">选择或新建文件夹</button><button id="reconnect-folder" hidden>重新授权当前文件夹</button><p class="hint">新建时选择空文件夹；换电脑时复制整个资料库，再在这里打开。</p></section>
<section id="library" hidden><div class="filters"><input id="search" type="search" placeholder="搜索记录、标题、标签…" aria-label="搜索笔记"><label><input type="checkbox" id="thoughts-only"> 只看我的想法</label><button id="clear-filter" hidden>清除标签筛选</button></div><div id="content"></div></section>
</main>
<dialog id="editor"><form id="edit-form"><header><h2 id="edit-title"></h2><button type="button" id="close-editor" aria-label="关闭编辑">×</button></header><div id="edit-fields"></div><div id="edit-gallery"></div><input id="image-files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden><div id="image-tools"><button id="add-images" type="button">＋ 添加图片</button><span class="hint">也可直接粘贴截图</span></div><p id="editor-error" role="status"></p><div id="editor-conflict" hidden><h3>当前已保存的内容</h3><pre id="editor-current"></pre><button type="button" id="rebase-editor">已核对，用上方草稿更新</button></div><footer><span class="hint">支持 Markdown · 保存到当前文件夹</span><button class="primary" type="submit">保存</button></footer></form></dialog>
<dialog id="settings"><header><h2>资料库与备份</h2><button id="close-settings" aria-label="关闭设置">×</button></header><p id="current-folder"></p><div class="settings-buttons"><button id="change-folder">打开其他文件夹</button><button id="backup-folder">完整备份到文件夹</button><button id="export-md">导出 Markdown</button></div><p class="hint">完整备份包含笔记、图片和字幕。复制整个文件夹即可迁移到 Windows 或 Mac；不自动同步，不支持多个浏览器同时编辑同一文件夹。</p><p id="settings-error" role="status"></p></dialog>
<dialog id="image-viewer"><button id="close-image" aria-label="关闭图片">×</button><img alt="笔记图片"></dialog>
<script type="module" src="library.js"></script></body></html>
